name: Build and Push

on:
  push:
    branches: [main,alfatrust-truststore]

env:
  REGISTRY: registry.aity.tech
  IMAGE_NAME: alfatrust/dss-demo-webapp
  CHART_NAME: dss-demo-webapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: helm package chart/

      - name: Push Helm chart to Harbor OCI
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | helm registry login ${{ env.REGISTRY }} --username "${{ secrets.HARBOR_USERNAME }}" --password-stdin
          helm push ${{ env.CHART_NAME }}-*.tgz oci://${{ env.REGISTRY }}/alfatrust/helm
